name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontmatter:
    name: Frontmatter (per-file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-frontmatter.sh
        run: ./scripts/validate-frontmatter.sh

  contract:
    name: Public/Hidden contract (cross-file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-contract.sh --strict
        run: ./scripts/validate-contract.sh --strict

  list-skills:
    name: Marketplace catalog sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run list-skills.sh
        run: ./scripts/list-skills.sh

  links:
    name: Relative markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run link-check.sh
        run: ./scripts/link-check.sh

  plugin-tests:
    name: Plugin tests (tests/<plugin>/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq
        run: command -v jq || (sudo apt-get update -qq && sudo apt-get install -y -qq jq)
      - name: Run every tests/*/test-*.sh
        run: |
          status=0
          for t in tests/*/test-*.sh; do
            [ -e "$t" ] || continue
            echo "== $t"
            "$t" || status=1
          done
          exit $status
